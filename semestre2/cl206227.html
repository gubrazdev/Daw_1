<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Document</title>
        
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                background: linear-gradient(180deg, #a2c2e2, #d1b3e0);
                background-attachment: fixed;
                height: 100vh;               
            }
            h1{
                color: white;
                text-shadow: purple 2px 2px 4px;
                font-size: 45px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .convite{
                display: flex;
                flex-direction: column;
                align-items: center;        
                background-color: white;
                padding: 20px;
                border-radius: 5px;
                width: 600px;
                margin: 0 auto;
                box-shadow: 0px 4px 8px rgb(26, 25, 25);
                color: #333;
                font-size: 20px;
            }
            input[type=text]{
                width: 60%;
                border: 2px solid gray;
                border-radius: 8px;
                margin-bottom: 10px;
                margin-top: 15px;
            }
            input[type=text]:hover{
                border: 4px solid purple;

            }
            input[type=submit]{
                width: 60%;
                background:rgb(146, 20, 226);
                color: white;
                font-size: 15px;
                font-weight: bold;
                height: 30px;
                border: 0px;
                border-radius: 5px;
            }
            input[type=submit]:hover{
                background:rgb(168, 71, 228);
                cursor: pointer;
                height: 35px;
            }
        </style>    
    </head>
    <body>

            <h1>Convite-Oficina de inteligência artificial </h1>
            <br>
         <div class="convite">  
            <p>
                <strong>🗓️Data</strong>: 15/06/2024 <br>   
                <strong>⏱️Horário</strong> 14:00 às 17:00 <br>
                <strong>📍Local</strong>: Laboratório de informática 2 <br>
            </p>
            <label for="ra">Informe seu RA:</label>
            <input type="text" id="ra" placeholder="ex:231045">
            <br>
            <input type="submit" value="Confirmar presença">
        </div>
    </body>
</html>
