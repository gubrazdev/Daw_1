<!DOCTYPE html>
    <html>
        <head>
            <meta charset="utf-8">
            <title>Tipos de posicionamento</title>
            <style>

                div.caixa{
                    width: 150px;
                    height: 150px;
                    border: 1px black solid;
                    margin-bottom: 10px;
                    color: white;
                    position: relative;/*posição da div*/
                }

                #cx1{
                    background-color: red;
                    top: 50px;
                    left: 100px;
                    z-index: 1;/*Camada da div*/
                    opacity: 0.8;/*Transparência*/
                }

                #cx2{
                    background-color: blue;
                    top: 20px;
                    left: 50px;
                    opacity: 0.8;
                }

                #cx3{
                    background-color: yellow;
                    bottom: 50px;
                    left: 10px;
                    opacity: 0.8;
                    color: black;
                }

                .pai{
                    width: 300px;
                    height: 200px;
                    background-color: lightgray;
                    border: 2px solid #333;
                    padding: 10px;
                    position: relative;
                }

                .filha{
                    width: 100px;
                    height: 100px;
                    background-color: tomato;
                    color: white;
                    text-align: center;
                    line-height: 100px;
                    position: absolute;/*Se desloca na div pai*/
                    
                }

            </style>
        </head>
        <body> 
            <div id="cx1" class="caixa">Caixa 1</div>
            <div id="cx2" class="caixa">Caixa 2</div>
            <div id="cx3" class="caixa">Caixa 3</div>
                    <hr>

            <div class="pai"> 

                <p>Coteúdo do container</p>

                <div class="filha">Absoluta</div>
            </div>

        </body>
    </html>
