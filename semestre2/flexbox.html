<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Document</title>

    <style>
        h2{
            text-align: center;
        }
        .quadro{
            border: 1px black solid;
            display: flex;
            flex-direction: row; /*column*/
            gap: 10px;
            flex-wrap: wrap; /*nowrap*/
            height: auto;
            height: 500px;
            align-items: center;
            justify-content: center; /*alinha no centro*/            
            /*justify-content: flex-start;*/ /*alinha no começo*/            
            /*justify-content: flex-end;*/ /*alinha no final*/            
            /*justify-content: space-between;*/ /*ajusta o espaço para ocupar a box inteira*/            
            /*justify-content: space-evely;*/ /*ajusta o espaço de dentro e de fora*/            
        }
        .quadro img{
            width: 200px;
            height: auto;
            opacity: 0.7;
        }
        .quadro img:hover{
            border: 1px black solid;
            opacity: 1;
        }
        .inicio{
            align-self: flex-start;
        }
        .meio{
            align-self: center;
        }
        .fim{
            align-self: flex-end;
        }
        .item{
            flex-basis: 200px;
            flex-grow: 1;
        }
        .itemMaior{
            flex-grow: 2; /*Faz a imagem crescer*/
        }
        .item img{
            width: 100%;
            height: auto;
        }
        h3{
            margin: 0px;
            text-align: center;
            color: red;
        }
        p{
            margin-top: 0;
            text-align: center;
        }
    </style>
    </head>
    <body>
        <h2>Qudro de funcionários</h2>

        <div class="quadro">
           <img src="Imagens/fotos/fotoFunc1.png" class="fim">     
           <img src="Imagens/fotos/fotoFunc2.png" class="meio">     
           <img src="Imagens/fotos/fotoFunc3.png" class="inicio">     
           <!--<img src="Imagens/fotos/fotoFunc4.png">     
           <img src="Imagens/fotos/fotoFunc5.png">     
           <img src="Imagens/fotos/fotoFunc6.png">     
           <img src="Imagens/fotos/fotoFunc7.png">     
           <img src="Imagens/fotos/fotoFunc8.png">-->     
        </div> 
    </body>
</html>
