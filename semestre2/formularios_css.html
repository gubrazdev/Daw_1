<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
        }

        h1{
            text-align: center;
        }

        form{
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            margin: 0 auto;
            box-shadow: 0 0 10px lightgray;
        }

        label{
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"], /*outro jeito de escrever o id*/
        input[type="email"],
        input[type="date"],
        textarea{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }

        textarea{
            height: 100px;
            resize: vertical;
        }

        input[type="radio"]{
            margin-right: 5px;
        }

        input[type="range"]{
            width: 90%;
            margin-top: 5px;
        }

        input[type=reset]{
            margin-top: 20px;
            padding: 10px 15px;
            background: linear-gradient(90deg, red,rgb(252, 68, 68) );
            border: none;
            border-radius: 10px;
            color: #f2f2f2;
        }

        
        input[type=submit]{
            margin-top: 20px;
            padding: 10px 15px;
            background: linear-gradient(90deg, green,rgb(3, 233, 3) );
            border: none;
            border-radius: 10px;
            color: #f2f2f2;
        }
    </style>
</head>
    <body>
        <h1>Formulário de contato</h1>

        <form>
            <legend><b><small>Dados Pessoais</small></b></legend>
                <label for="nome">Nome:<br></label>
                    <input type="text" name="nome" id="nome" size="40" maxlength="20" minlength="5" required placeholder="Digite seu nome">
                                <br>

                <labeL for="email">E-Mail:<br></labeL>
                    <input type="email" id="email" required placeholder="nome@email.com">
                                <br>

                <label for="telefone">Telefone:</label><br>
                    <input type="text" name="telefone" id="telefone" minlength="6" required>
                                <br>

                <Label for="sexo">Sexo:</label><br>
                    M<input type="radio" id="sexo" name="sexo" value="F">
                    F<input type="radio" id="sexo" name="sexo" value="M">
                                <br>

                <label for="dtnasc">Data de nascimento:</Label><br>
                    <input type="date" id="dtnasc" name="dtnasc">
                                <br>
                                        
                <label for="avaliacao">Avaliação do nosso site:<br></label>
                        0 <input type="range" name="capaz" id="capaz" max="10" min="0" value="3"> 10
                                <br>
                
                <label for="msg">Mensagem<br></label>
                    <textarea id="msg"></textarea>
                                <br>
                                
                    <input type="submit" value="cadastrar">           
                    <input type="reset"value="limpar">
        </form> 

    </body>
</html>
