<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background:linear-gradient(to right,rgb(66, 189, 223), rgb(146, 20, 226));
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;/*Ajusta à altura da tela*/
        }
        #box{
            background-color: white;
            padding: 20px;
            border-radius: 5px;
        }
        h2{
            background: linear-gradient(to right, rgb(66, 189, 223), rgb(146, 20, 226));
            color: transparent;/*Cor do texto transparente*/
            background-clip: text;/*Deixa o background no texto*/
        }
        label{
            color: rgb(66, 189, 223);
            font-weight: bold;
        }
        label:hover{
            color: rgb(146, 20, 226);
        }
        input[type=text],
        input[type=password]{
            width: 100%;
            height: 20px;
            margin-bottom: 10px;
            margin-top: 5px;
            border: 0;
            border-bottom: 1px solid rgb(66, 189, 223);
        }
        input[type=text]:hover,
        input[type=password]:hover{
            border-bottom: 1px solid rgb(146, 20, 226);
        }
        input[type=text]:focus,
        input[type=password]:focus{
            outline: none;
            border-bottom: 1px solid rgb(146, 20, 226);
        }
        input[type=submit]{
            width: 100%;
            background:linear-gradient(to right, rgb(66, 189, 223), rgb(146, 20, 226));
            color: white;
            font-size: 15px;
            font-weight: bold;
            height: 30px;
            border: 0px;
            border-radius: 5px;
        }
        input[type=submit]:hover{
            background:linear-gradient(to left, rgb(66, 189, 223), rgb(146, 20, 226));
        }
    </style>
</head>
    <body>
        <div id="box">

            <h2>Cadastro de usuário</h2>
            
            <form>
                <label for="login">Login:</label>
                <input type="text" name="login" id="login">
                            <br>
                <label for="senha">Senha:</label>
                <input type="password" name="senha" id="senha" maxlength="8" required>
                            <br>
                <input type="submit" value="cadastrar">           
            </form> 
        </div>

    </body>
</html>
