<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>animacao_frames.html</title>
        <style>
            div{
                width:150px ;
                height: 100px;
                position: relative;/*deixa mudar a posição*/
                animation: fantasma 10s;
                animation-iteration-count: infinite;
                animation-direction: alternate;
            }
            @keyframes fantasma{
                0%{
                    left: 0px;
                    top: 0px;
                    transform: scale(0);
                }
                25%{
                    left: 250px;
                    top: 0px;
                    transform: scale(0.25);
                }
                50%{
                    left: 250px;
                    top: 250px;
                    transform: scale(0.50);
                }
                75%{
                    left: 0px;
                    top: 250px;
                    transform: scale(0.75);
                }
                100%{
                    left: 0px;
                    top: 0px;
                    transform: scale(1);
                }
            }
        </style>
    </head>
    <body>
        <div>
            <img src="Imagens/fantasma.png" width="200px">
        </div>
    </body>
</html>
