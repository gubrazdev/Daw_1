<!DOCTYPE html>
<charset="UTF-8">
<html>
    <head>
        <title>Uniclínica</title>
    </head>
    <body>
        <a href="index.html">Inicio</a>
            <hr>
        <h1>CLINICA VETERINÁRIA UNICLÍNICA - CADASTRO</h1>
            <br><br>
        Cadastre seu pet para agilizar seu atendimento.
            <br><br>
        <form>
            <label for="nome">Nome do animal:</label><br>
                <input type="text" id="nome" name="nome">
                            <br><br>
            <label for="sexo">Sexo:</label><br>
                F<input type="radio" id="sexo" name="sexo" value="F">
                M<input type="radio" id="sexo" name="sexo" value="M">
                            <br><br>
            <label for="especie">Espécie:</label><br>
                <select>
                    <option value="cachorro">Cachorro</option>
                    <option value="gato">Gato</option>
                    <option value="coelho">Coelho</option>
                    <option value="hamster">Hamster</option>
                    <option value="passaro">Pássaro</option>
                </select>
                            <br><br>
            <label for="idade">Idade:</label><br>
                <input type="number" id="idade" name="idade" min="0">
                            <br>    
                <small>(em anos)</small>
                            <br><br>
            <label for="observacoes">Observações:</label><br>
                <textarea id="observacoes" name="observacoes" rows="4" cols="30"></textarea>
                            <br><br>
            <input type="submit" value="Cadastrar">                
        </form>
    </body> 
</html>
